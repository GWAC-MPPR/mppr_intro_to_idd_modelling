on:
  workflow_dispatch:
  push:
    branches: main

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.37
          tinytex: true

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # slides.qmd declares engine: knitr, so R is required even though no
      # slide currently contains a live code chunk.
      - name: Install dependencies
        run: |
          install.packages(c("rmarkdown", "knitr", "tinytex"))
        shell: Rscript {0}

      # The beamer theme is not part of the TinyTeX base install, and the
      # mtheme submodule that used to vendor it was removed in 133c0c8.
      # Driven through the tinytex R package rather than calling tlmgr
      # directly: the setup action only puts tlmgr on PATH for macOS and
      # Windows, while on Linux Quarto installs TinyTeX to ~/.TinyTeX.
      - name: Install LaTeX packages for the beamer theme
        run: |
          tinytex::tlmgr_install(c("beamertheme-metropolis", "pgfopts"))
        shell: Rscript {0}

      # On main the publish step below does its own render. Off main nothing
      # publishes, so render here purely to prove the deck still builds.
      - name: Render slides to revealjs (build check)
        if: github.ref != 'refs/heads/main'
        run: quarto render slides.qmd --to revealjs

      # Publishing is outward-facing, so it only runs on main. Let the action
      # render rather than passing render: false — with --no-render quarto
      # skips resource discovery and images/ never reaches gh-pages.
      - name: Publish slides to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: slides.qmd

      # Deliberately after the publish step: slides.pdf must not exist in the
      # working tree while quarto publish is copying output to gh-pages, or a
      # 25MB PDF gets committed to that branch on every build.
      - name: Render slides to PDF
        run: quarto render slides.qmd --profile pdf --to beamer

      # The README links to releases/latest/download/slides.pdf, so refreshing
      # the asset on this release keeps that link current.
      - name: Attach PDF to the slides release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload slides-2026 slides.pdf --clobber
